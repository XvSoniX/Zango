databaseChangeLog:
  - changeSet:
      id: 003-create-credentials
      author: zango
      changes:
        - createTable:
            tableName: credentials
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_credentials
                    nullable: false
              - column:
                  name: user_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: identifier
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: identifier_type
                  type: varchar(32)
                  constraints:
                    nullable: false
              - column:
                  name: password_hash
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: verified
                  type: boolean
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamp(6) with time zone
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: timestamp(6) with time zone
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: credentials
            baseColumnNames: user_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_credentials_user_id
        - addUniqueConstraint:
            tableName: credentials
            columnNames: identifier_type, identifier
            constraintName: uk_credentials_identifier_type_identifier
        - createIndex:
            tableName: credentials
            indexName: idx_credentials_user_id
            columns:
              - column:
                  name: user_id
