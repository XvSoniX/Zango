databaseChangeLog:
  - changeSet:
      id: 001-create-users
      author: zango
      changes:
        - createTable:
            tableName: users
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_users
                    nullable: false
              - column:
                  name: status
                  type: varchar(32)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamp(6) with time zone
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: timestamp(6) with time zone
                  constraints:
                    nullable: false
              - column:
                  name: deleted_at
                  type: timestamp(6) with time zone
