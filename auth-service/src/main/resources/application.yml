server:
  port: ${AUTH_SERVICE_PORT:8081}

spring:
  application:
    name: auth-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: jdbc:postgresql://${AUTH_DB_HOST:localhost}:${AUTH_DB_PORT:5432}/${AUTH_DB_NAME:zango_auth}
    username: ${AUTH_DB_USERNAME}
    password: ${AUTH_DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: ${AUTH_DB_SCHEMA:public}
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    default-schema: ${AUTH_DB_SCHEMA:public}
  messages:
    basename: i18n/messages
    encoding: UTF-8
    fallback-to-system-locale: false
  jackson:
    deserialization:
      fail-on-unknown-properties: true

eureka:
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://root:toor123@localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

logging:
  file:
    name: logs/auth/auth-service.log
  level:
    root: ${AUTH_LOG_LEVEL:INFO}
    ir.zango.auth: ${AUTH_LOG_LEVEL:INFO}
    com.netflix.eureka: WARN
    com.netflix.discovery: WARN

zango:
  auth:
    jwt:
      private-key-path: ${JWT_PRIVATE_KEY_PATH:./gateway-service/keys/private.pem}
      issuer: ${JWT_ISSUER:https://zango.ir}
      access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:15m}
      key-id: ${JWT_KEY_ID:zango-auth-rs256-1}
    database:
      host: ${AUTH_DB_HOST:}
      port: ${AUTH_DB_PORT:5432}
      name: ${AUTH_DB_NAME:}
      username: ${AUTH_DB_USERNAME:}
      password: ${AUTH_DB_PASSWORD:}
      schema: ${AUTH_DB_SCHEMA:}
