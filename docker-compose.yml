  admin-db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${ADMIN_DB_NAME:-nextminds_admin}
      POSTGRES_USER: ${ADMIN_DB_USERNAME:-nextminds}
      POSTGRES_PASSWORD: ${ADMIN_DB_PASSWORD:?Set ADMIN_DB_PASSWORD}
    volumes:
      - nextminds-admin-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - nextminds

  admin-service:
    build:
      context: .
      args:
        SERVICE: admin-service
        PORT: "${ADMIN_SERVICE_PORT:-8083}"
    image: nextminds-admin
    restart: unless-stopped
    stop_grace_period: 30s
    depends_on:
      discovery-service:
        condition: service_healthy
      admin-db:
        condition: service_healthy
    environment:
      ADMIN_SERVICE_PORT: "${ADMIN_SERVICE_PORT:-8083}"
      SERVER_SHUTDOWN: graceful
      SPRING_LIFECYCLE_TIMEOUT_PER_SHUTDOWN_PHASE: 20s
      EUREKA_SERVER_URL: http://${EUREKA_USERNAME:-root}:${EUREKA_PASSWORD:?Set EUREKA_PASSWORD}@discovery-service:${DISCOVERY_PORT:-8761}/eureka/
      ADMIN_DB_HOST: admin-db
      ADMIN_DB_PORT: "5432"
      ADMIN_DB_NAME: ${ADMIN_DB_NAME:-nextminds_admin}
      ADMIN_DB_USERNAME: ${ADMIN_DB_USERNAME:-nextminds}
      ADMIN_DB_PASSWORD: ${ADMIN_DB_PASSWORD:?Set ADMIN_DB_PASSWORD}
      ADMIN_DB_SCHEMA: ${ADMIN_DB_SCHEMA:-public}
      JWT_PUBLIC_KEY_PATH: /run/secrets/public.pem
      JWT_ISSUER: ${JWT_ISSUER:-http://localhost:8081}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-nextminds}
      LOGGING_FILE_NAME: ""
    ports:
      - "127.0.0.1:${ADMIN_SERVICE_PORT:-8083}:${ADMIN_SERVICE_PORT:-8083}"
    volumes:
      - "${JWT_PUBLIC_KEY_FILE:-./gateway-service/keys/public.pem}:/run/secrets/public.pem:ro"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:${ADMIN_SERVICE_PORT:-8083}/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 90s
    networks:
      - nextminds

  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    networks:
      - nextminds

  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:?Set GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3001}:3000"
    depends_on:
      - prometheus
    networks:
      - nextminds

networks:
  nextminds:
    name: nextminds

volumes:
  nextminds-auth-db:
  nextminds-user-db:
  nextminds-admin-db:
