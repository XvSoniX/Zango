services:
  nginx:
    build:
      context: ./infrastructure/nginx
    image: nextminds-nginx
    restart: unless-stopped
    depends_on:
      gateway-service:
        condition: service_healthy
    environment:
      GATEWAY_PORT: "${GATEWAY_PORT:-8080}"
      FRONTEND_HOST: ${FRONTEND_HOST:-frontend}
      FRONTEND_PORT: "${FRONTEND_PORT:-3000}"
      NGINX_PROXY_CONNECT_TIMEOUT: ${NGINX_PROXY_CONNECT_TIMEOUT:-3s}
      NGINX_PROXY_READ_TIMEOUT: ${NGINX_PROXY_READ_TIMEOUT:-60s}
      NGINX_PROXY_SEND_TIMEOUT: ${NGINX_PROXY_SEND_TIMEOUT:-60s}
      NGINX_CLIENT_MAX_BODY_SIZE: ${NGINX_CLIENT_MAX_BODY_SIZE:-0}
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
    networks:
      - nextminds

  discovery-service:
    build:
      context: .
      args:
        SERVICE: discovery-service
        PORT: "${DISCOVERY_PORT:-8761}"
    image: nextminds-discovery
    environment:
      EUREKA_HOSTNAME: discovery-service
      EUREKA_USERNAME: ${EUREKA_USERNAME:-root}
      EUREKA_PASSWORD: ${EUREKA_PASSWORD:?Set EUREKA_PASSWORD}
      LOGGING_FILE_NAME: ""
    ports:
      - "127.0.0.1:${DISCOVERY_PORT:-8761}:${DISCOVERY_PORT:-8761}"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:${DISCOVERY_PORT:-8761}/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - nextminds

  gateway-service:
    build:
      context: .
      args:
        SERVICE: gateway-service
        PORT: "${GATEWAY_PORT:-8080}"
    image: nextminds-gateway
    depends_on:
      discovery-service:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    environment:
      GATEWAY_PORT: "${GATEWAY_PORT:-8080}"
      EUREKA_USERNAME: ${EUREKA_USERNAME:-root}
      EUREKA_PASSWORD: ${EUREKA_PASSWORD:?Set EUREKA_PASSWORD}
      EUREKA_SERVER_URL: http://${EUREKA_USERNAME:-root}:${EUREKA_PASSWORD:?Set EUREKA_PASSWORD}@discovery-service:${DISCOVERY_PORT:-8761}/eureka/
      JWT_PUBLIC_KEY_PATH: /run/secrets/public.pem
      JWT_ISSUER: ${JWT_ISSUER:-http://localhost:8081}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-nextminds}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      LOGGING_FILE_NAME: ""
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-8080}:${GATEWAY_PORT:-8080}"
    volumes:
      - "${JWT_PUBLIC_KEY_FILE:-./gateway-service/keys/public.pem}:/run/secrets/public.pem:ro"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:${GATEWAY_PORT:-8080}/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - nextminds

  auth-db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${AUTH_DB_NAME:-nextminds_auth}
      POSTGRES_USER: ${AUTH_DB_USERNAME:-nextminds}
      POSTGRES_PASSWORD: ${AUTH_DB_PASSWORD:?Set AUTH_DB_PASSWORD}
    volumes:
      - nextminds-auth-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - nextminds

  auth-service:
    build:
      context: .
      args:
        SERVICE: auth-service
        PORT: "${AUTH_SERVICE_PORT:-8081}"
    image: nextminds-auth
    restart: unless-stopped
    stop_grace_period: 30s
    depends_on:
      discovery-service:
        condition: service_healthy
      auth-db:
        condition: service_healthy
    environment:
      AUTH_SERVICE_PORT: "${AUTH_SERVICE_PORT:-8081}"
      SERVER_SHUTDOWN: graceful
      SPRING_LIFECYCLE_TIMEOUT_PER_SHUTDOWN_PHASE: 20s
      EUREKA_SERVER_URL: http://${EUREKA_USERNAME:-root}:${EUREKA_PASSWORD:?Set EUREKA_PASSWORD}@discovery-service:${DISCOVERY_PORT:-8761}/eureka/
      AUTH_DB_HOST: auth-db
      AUTH_DB_PORT: "5432"
      AUTH_DB_NAME: ${AUTH_DB_NAME:-nextminds_auth}
      AUTH_DB_USERNAME: ${AUTH_DB_USERNAME:-nextminds}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD:?Set AUTH_DB_PASSWORD}
      AUTH_DB_SCHEMA: ${AUTH_DB_SCHEMA:-public}
      JWT_PRIVATE_KEY_PATH: /run/secrets/private.pem
      JWT_ISSUER: ${JWT_ISSUER:-http://localhost:8081}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-nextminds}
      JWT_ACCESS_TOKEN_TTL: ${JWT_ACCESS_TOKEN_TTL:-15m}
      JWT_KEY_ID: ${JWT_KEY_ID:-nextminds-auth-rs256-1}
      REFRESH_TOKEN_TTL: ${REFRESH_TOKEN_TTL:-24h}
      PASSWORD_RESET_TTL: ${PASSWORD_RESET_TTL:-30m}
      PASSWORD_RESET_RATE_LIMIT: ${PASSWORD_RESET_RATE_LIMIT:-5}
      PASSWORD_RESET_RATE_LIMIT_WINDOW: ${PASSWORD_RESET_RATE_LIMIT_WINDOW:-15m}
      LOGGING_FILE_NAME: ""
    ports:
      - "127.0.0.1:${AUTH_SERVICE_PORT:-8081}:${AUTH_SERVICE_PORT:-8081}"
    volumes:
      - "${JWT_PRIVATE_KEY_FILE:-./gateway-service/keys/private.pem}:/run/secrets/private.pem:ro"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:${AUTH_SERVICE_PORT:-8081}/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 90s
    networks:
      - nextminds

