server:
  port: ${CONSULTING_SERVICE_PORT:8082}

spring:
  application:
    name: consulting-service

eureka:
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://root:toor123@localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

logging:
  file:
    name: logs/consulting/consulting-service.log
  level:
    root: INFO
    ir.zango.consulting: INFO
    com.netflix.eureka: WARN
    com.netflix.discovery: WARN
