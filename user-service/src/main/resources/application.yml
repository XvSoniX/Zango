server:
  port: ${USER_SERVICE_PORT:8082}

spring:
  application:
    name: user-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: jdbc:postgresql://${USER_DB_HOST:localhost}:${USER_DB_PORT:5432}/${USER_DB_NAME:nextminds_user}
    username: ${USER_DB_USERNAME}
    password: ${USER_DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: ${USER_DB_SCHEMA:public}
        jdbc:
          time_zone: UTC
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    default-schema: ${USER_DB_SCHEMA:public}
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100
  jackson:
    deserialization:
      fail-on-unknown-properties: true

eureka:
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://root:toor123@localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

logging:
  file:
    name: logs/user/user-service.log
  level:
    root: ${USER_LOG_LEVEL:INFO}
    ir.nextminds.user: ${USER_LOG_LEVEL:INFO}
    com.netflix.eureka: WARN
    com.netflix.discovery: WARN

nextminds:
  user:
    age-limits:
      min: 8
      max: 18
