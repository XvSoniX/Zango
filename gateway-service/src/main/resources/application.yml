server:
  port: ${GATEWAY_PORT:8080}

spring:
  application:
    name: gateway-service

  cloud:
    gateway:
      server:
        webflux:
          httpclient:
            connect-timeout: 3000

            response-timeout: 5s
          default-filters:
            - name: Retry
              args:
                retries: 1
                methods:
                  - GET
                statuses:
                  - BAD_GATEWAY
                  - SERVICE_UNAVAILABLE
                  - GATEWAY_TIMEOUT
                exceptions:
                  - java.io.IOException
                  - java.util.concurrent.TimeoutException
                backoff:
                  firstBackoff: 200ms
                  maxBackoff: 1s
                  factor: 2
                  basedOnPreviousValue: false

          globalcors:
            cors-configurations:
              '[/**]':
                allowed-origins:
                  - ${FRONTEND_URL:http://localhost:3000}
                allowed-methods:
                  - GET
                  - POST
                  - PUT
                  - PATCH
                  - DELETE
                  - OPTIONS
                allowed-headers:
                  - Authorization
                  - Content-Type
                  - Accept
                allow-credentials: false
                max-age: 3600

          discovery:
            locator:
              enabled: false

          routes:
            - id: auth-service
              uri: lb://AUTH-SERVICE
              predicates:
                - Path=/api/v1/auth/**

  security:
    oauth2:
      resourceserver:
        jwt:
          public-key-location: file:${JWT_PUBLIC_KEY_PATH:./gateway-service/keys/public.pem}
          jws-algorithms:
            - RS256
          audiences:
            - ${JWT_AUDIENCE:zango}
  messages:
    basename: i18n/messages
    encoding: UTF-8
    fallback-to-system-locale: false

zango:
  jwt:
    issuer: ${JWT_ISSUER:http://localhost:8081}
  gateway:
    security:
      rules:
        - method: GET
          paths:
            - /actuator/health
            - /actuator/health/**
          access: PUBLIC
        - method: POST
          paths:
            - /api/v1/auth/login
            - /api/v1/auth/register
            - /api/v1/auth/refresh
            - /api/v1/auth/password/forgot
            - /api/v1/auth/password/reset
            - /api/v1/auth/logout
          access: PUBLIC
        - paths:
            - /api/v1/auth/admin/**
          access: ROLE
          roles:
            - ROLE_ADMIN
        - method: GET
          paths:
            - /api/v1/auth/roles/me
          access: AUTHENTICATED
        - method: POST
          paths:
            - /api/v1/auth/logout-all
            - /api/v1/auth/password/change
          access: AUTHENTICATED

eureka:
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}

  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://root:toor123@localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

  endpoint:
    health:
      show-details: never

resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        permitted-number-of-calls-in-half-open-state: 3
        wait-duration-in-open-state: 10s
        automatic-transition-from-open-to-half-open-enabled: true

#    instances:
#      authService:
#        base-config: default

logging:
  file:
    name: logs/gateway/gateway-service.log
  level:
    com.netflix.eureka: WARN
    com.netflix.discovery: WARN